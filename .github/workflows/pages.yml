# Онлайн-версія на GitHub Pages: при кожному пуші в main проганяємо тести,
# збираємо редактор і викладаємо lab/public як статичний сайт.
# На сайті працює заготовка моделі; справжня модель — тільки з локальним сервером (npm run lab).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lab:build
      # Версія в адресах модулів: після деплою браузер не візьме зі свого кешу старі файли
      - run: node scripts/stamp-version.mjs lab/public ${GITHUB_SHA::7}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lab/public

      - id: deployment
        uses: actions/deploy-pages@v4
